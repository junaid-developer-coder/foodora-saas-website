  <script src="../../js/app.js"></script>
  <script>
    function renderCoupons() {
      const tbody = document.getElementById("adminCouponsTableBody");
      if (!tbody) return;
      const list = StorageManager.getCoupons();
      tbody.innerHTML = list.map((c, idx) => `
        <tr>
          <td><span class="badge badge-orange font-bold">${c.code}</span></td>
          <td>${c.discountType.toUpperCase()}</td>
          <td>${c.discountType === 'percent' ? `${c.discountValue}%` : (c.discountType === 'fixed' ? `Rs. ${c.discountValue}` : 'Free Delivery')}</td>
          <td>${c.minOrder ? `Rs. ${c.minOrder.toLocaleString()}` : 'None'}</td>
          <td class="text-xs">${c.description}</td>
          <td>
            <button class="btn btn-outline btn-sm text-danger" onclick="deleteCoupon(${idx})">Delete</button>
          </td>
        </tr>
      `).join("");
    }

    function deleteCoupon(index) {
      if (confirm("Delete this promotional coupon?")) {
        const list = StorageManager.getCoupons();
        list.splice(index, 1);
        StorageManager.saveCoupons(list);
        FoodoraApp.showToast("Coupon deleted.", "info");
        renderCoupons();
      }
    }

    function promptAddCoupon() {
      const code = prompt("Enter Coupon Code (e.g. FLASH30):");
      if (!code) return;
      const val = prompt("Enter Discount Value (e.g. 30 for 30%):", "30");
      const desc = prompt("Enter Voucher Description:", "30% OFF Special Flash Deal");
      const list = StorageManager.getCoupons();
      list.unshift({
        code: code.toUpperCase(),
        discountType: "percent",
        discountValue: parseInt(val) || 20,
        maxDiscount: 500,
        minOrder: 600,
        expiresAt: "2026-12-31",
        description: desc || "Promotional Deal"
      });
      StorageManager.saveCoupons(list);
      FoodoraApp.showToast(`Coupon ${code} created!`, "success");
      renderCoupons();
    }

    document.addEventListener("DOMContentLoaded", renderCoupons);
  </script>

  <script src="../../js/data.js"></script>

  <script src="../../js/app.js"></script>
  <script>
    function renderCategories() {
      const grid = document.getElementById("adminCategoriesGrid");
      if (!grid) return;
      const cats = StorageManager.getCategories();
      grid.innerHTML = cats.map((c, idx) => `
        <div class="card p-5 text-center flex flex-col items-center" style="border-radius: var(--radius-xl);">
          <div style="font-size: 40px; margin-bottom: var(--space-2);">${c.icon}</div>
          <h3 class="text-base font-bold mb-1">${c.name}</h3>
          <span class="text-xs text-muted mb-4">${c.count || 10} dishes listed</span>
          <button class="btn btn-outline btn-sm text-danger" onclick="deleteCategory(${idx})">Delete Category</button>
        </div>
      `).join("");
    }

    function deleteCategory(index) {
      if (confirm("Delete this food category?")) {
        const cats = StorageManager.getCategories();
        cats.splice(index, 1);
        StorageManager.saveCategories(cats);
        FoodoraApp.showToast("Category removed.", "info");
        renderCategories();
      }
    }

    function addNewCategoryPrompt() {
      const name = prompt("Enter Category Name (e.g. Seafood, Sandwiches):");
      if (!name) return;
      const icon = prompt("Enter an emoji icon (e.g. 🍤, 🥪):", "🍲");
      const cats = StorageManager.getCategories();
      cats.push({
        id: "cat_" + Date.now(),
        name: name,
        icon: icon || "🍽️",
        count: 0
      });
      StorageManager.saveCategories(cats);
      FoodoraApp.showToast(`Category "${name}" added!`, "success");
      renderCategories();
    }

    document.addEventListener("DOMContentLoaded", renderCategories);
  </script>

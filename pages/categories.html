<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Categories - Foodora SaaS</title>
  <meta name="description" content="Explore food categories from juicy burgers to spicy biryanis and authentic pizzas." />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- SITE HEADER -->
    <header class="site-header">
      <div class="container header-inner">
        <a href="../index.html" class="brand-logo">
          <div class="brand-icon-box">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"></path></svg>
          </div>
          <div class="brand-text">Foodora<span>SaaS</span></div>
        </a>

        <nav class="nav-links">
          <a href="../index.html" class="nav-link">Home</a>
          <a href="restaurants.html" class="nav-link">Restaurants</a>
          <a href="categories.html" class="nav-link active">Categories</a>
          <a href="offers.html" class="nav-link">Offers</a>
          <a href="about.html" class="nav-link">About Us</a>
        </nav>

        <div class="header-actions">
          <button class="theme-toggle-btn" title="Toggle Theme">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <a href="cart.html" class="header-cart-btn" title="Cart">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            <span class="cart-badge" style="display: none;">0</span>
          </a>
          <div id="headerUserWrap"></div>
          <button class="mobile-nav-toggle"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content py-8">
      <div class="container">
        <div class="section-header">
          <div class="section-tag">Menu Explorer</div>
          <h1 class="section-title">Food Categories</h1>
          <p class="section-desc">Select a category to discover all available dishes and restaurant specialists.</p>
        </div>

        <div class="grid grid-cols-1 grid-cols-2 grid-cols-4 gap-6" id="categoriesFullGrid"></div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="container footer-bottom">
        <div>© 2026 Foodora SaaS. All rights reserved.</div>
        <div class="footer-bottom-links">
          <a href="../index.html">Home</a>
          <a href="restaurants.html">Restaurants</a>
          <a href="offers.html">Deals</a>
        </div>
      </div>
    </footer>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("categoriesFullGrid");
      if (grid) {
        const cats = StorageManager.getCategories();
        grid.innerHTML = cats.map(c => `
          <a href="restaurants.html?category=${c.id}" class="card flex flex-col items-center text-center p-6" style="border-radius: var(--radius-2xl); transition: transform 0.2s ease;">
            <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 38px; margin-bottom: var(--space-4);">
              ${c.icon}
            </div>
            <h3 class="text-lg font-bold mb-1">${c.name}</h3>
            <span class="text-xs text-muted mb-4">${c.count} Dishes Available</span>
            <span class="btn btn-secondary btn-sm">Explore ${c.name} ➔</span>
          </a>
        `).join("");
      }
    });
  </script>
</body>
</html>

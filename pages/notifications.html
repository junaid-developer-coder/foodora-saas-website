<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Center - Foodora SaaS</title>
  <meta name="description" content="View order tracking notifications, promo alerts, and system updates on Foodora SaaS." />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- SITE HEADER -->
    <header class="site-header">
      <div class="container header-inner">
        <a href="../index.html" class="brand-logo">
          <div class="brand-icon-box">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"></path></svg>
          </div>
          <div class="brand-text">Foodora<span>SaaS</span></div>
        </a>

        <nav class="nav-links">
          <a href="../index.html" class="nav-link">Home</a>
          <a href="restaurants.html" class="nav-link">Restaurants</a>
          <a href="categories.html" class="nav-link">Categories</a>
          <a href="offers.html" class="nav-link">Offers</a>
          <a href="orders.html" class="nav-link">Orders</a>
        </nav>

        <div class="header-actions">
          <button class="theme-toggle-btn" title="Toggle Theme">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <a href="cart.html" class="header-cart-btn" title="Cart">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            <span class="cart-badge" style="display: none;">0</span>
          </a>
          <div id="headerUserWrap"></div>
          <button class="mobile-nav-toggle"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content py-8">
      <div class="container" style="max-width: 800px;">
        <div class="section-header flex justify-between items-end flex-wrap gap-4 mb-6">
          <div>
            <div class="section-tag">Alerts & Updates</div>
            <h1 class="section-title">Notification Center 🔔</h1>
            <p class="section-desc">Stay informed about live order milestones, deals, and announcements.</p>
          </div>
          <button class="btn btn-outline btn-sm" id="markAllReadBtn">✓ Mark All as Read</button>
        </div>

        <!-- Filter Tabs -->
        <div class="flex gap-2 mb-6">
          <button class="filter-chip notif-filter-tab active" data-type="all">All Alerts</button>
          <button class="filter-chip notif-filter-tab" data-type="order">🛵 Order Updates</button>
          <button class="filter-chip notif-filter-tab" data-type="promo">🎉 Promos & Deals</button>
          <button class="filter-chip notif-filter-tab" data-type="system">📢 System Notes</button>
        </div>

        <!-- Notifications Container -->
        <div id="notificationsListContainer"></div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="container footer-bottom">
        <div>© 2026 Foodora SaaS. All rights reserved.</div>
        <div class="footer-bottom-links">
          <a href="../index.html">Home</a>
          <a href="orders.html">Orders</a>
          <a href="contact.html">Support</a>
        </div>
      </div>
    </footer>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/notifications.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Notifications.init();
    });
  </script>
</body>
</html>
